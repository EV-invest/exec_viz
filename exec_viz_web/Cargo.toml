[package]
name = "exec_viz_web"
description = "The wasm front-end over `exec_viz`'s wire types — built with `dx build`, served by whoever owns the graph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# A bundle, not a crate: `dx build` is what makes it, and there is nothing to `cargo add`.
publish = false

# `test = false` because the bin is wasm-only: a workspace `cargo test` otherwise compiles it for the
# host, against a `v_utils::lwc` that exists on wasm32 alone.
[[bin]]
name = "exec_viz_web"
path = "src/main.rs"
test = false

[features]
# The hosted-demo bundle: the tape is fetched once and scrubbed in this heap, so there is no server
# to hold the one cursor a `Viz` has and every visitor gets their own. Off = the app-served bundle,
# which talks to `exec_viz`'s axum half over JSON. A build-time choice because they are two
# artifacts, not two modes.
demo = ["exec_viz/tape"]

# `exec_viz` is pulled in with default features off — that leaves just `api_types`, so none of the
# axum/tokio server half is dragged onto the wasm target.
[dependencies]
ahash.workspace = true
dioxus.workspace = true
dockviewers_dioxus.workspace = true
exec_viz.workspace = true
futures.workspace = true
getrandom.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
v_utils = { workspace = true, features = ["lightweight_charts", "wasm"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "DomRect", "Element", "HtmlElement", "Storage", "Url", "Window", "KeyboardEvent", "console"] }

[lints]
workspace = true
