[package]
name = "exec_viz_web"
description = "The wasm front-end over `exec_viz`'s wire types — built with `dx build`, served by whoever owns the graph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# A bundle, not a crate: `dx build` is what makes it, and there is nothing to `cargo add`.
publish = false

# wasm-only bin. `exec_viz` is pulled in with default features off — that leaves just `api_types`,
# so none of the axum/tokio server half is dragged onto the wasm target.
[dependencies]
dioxus.workspace = true
dockviewers_dioxus.workspace = true
exec_viz.workspace = true
futures.workspace = true
getrandom.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
js-sys.workspace = true
serde.workspace = true
v_utils = { workspace = true, features = ["lightweight_charts", "wasm"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "DomRect", "Element", "HtmlElement", "Window", "KeyboardEvent", "console"] }

[lints]
workspace = true
