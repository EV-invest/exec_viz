cargo-features = ["codegen-backend"]

[workspace]
members = ["exec_viz", "exec_viz_*"]
default-members = ["exec_viz"]
resolver = "3"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow"
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.dependencies]
axum = "0.8"
color-eyre = "^0.6.5"
derive-new = "^0"
# --- web (Dioxus/wasm) frontend. wasm-bindgen pinned in lockstep with wasm-bindgen-cli (flake) and v_utils. ---
dioxus = { version = "0.7", features = ["web"] }
exec_viz_macros = { path = "exec_viz_macros" }
futures = "^0.3"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
miette = { version = "^7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1"
tokio = { version = "^1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "^0.1"
tracing-subscriber = "^0.3"
trading_data_dag = { path = "../trading_data/trading_data_dag" }
v_utils = { version = "^2.15.57", features = ["io", "macros", "cli"] }
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# Patches don't propagate across workspaces — re-declared here so the path-dep graph
# (trading_data → v_utils) and our own v_utils resolve to the same local checkout.
[patch.crates-io]
v_utils = { path = "../../v_utils/v_utils" }
