[package]
name = "exec_viz"
description = "Tick-by-tick replay of a trading_data computation DAG: a recording Observer, a scrubbable tape, and an axum server the browser front-end drives"
documentation = "https://docs.rs/exec_viz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Relative to this package dir; the README is the workspace's.
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["server"]
# The read half: `Viz`, the cursor ops, and the msgpack file both ends of. `rmp-serde` is the whole
# of it, so a front-end can hold the tape it scrubs instead of asking a server for it — which is
# what gives a hosted demo one cursor per visitor. `trading_data_dag` is deliberately *not* here:
# it carries `v_utils`, and through it `rand`/`getrandom`, which do not build for
# wasm32-unknown-unknown without a backend cfg the recording side has no reason to make a bundle
# take on.
tape = ["dep:rmp-serde"]
# The recording half (`Tape`/`Recorder`/`Rec`) and the axum server over it. Native.
server = ["tape", "dep:axum", "dep:tokio", "dep:tower-http", "dep:trading_data_dag"]

[dependencies]
axum = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde.workspace = true
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
trading_data_dag = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
