[package]
name = "exec_viz"
description = "Tick-by-tick replay of a trading_data computation DAG: a recording Observer, a scrubbable tape, and an axum server the browser front-end drives"
documentation = "https://docs.rs/exec_viz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Relative to this package dir; the README is the workspace's.
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["server"]
# The recording `Viz` observer + the axum server over it. Native only; with it off the crate is
# just `api_types`, which is all the wasm front-end (`exec_viz_web`) needs.
server = [
    "dep:axum",
    "dep:rmp-serde",
    "dep:tokio",
    "dep:tower-http",
    "dep:trading_data_dag",
]

[dependencies]
axum = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde.workspace = true
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
trading_data_dag = { workspace = true, optional = true }

[dev-dependencies]
# The `capacity` example reads its own replay ops back off the served tape — the browser's door, and
# the only one a consumer has either.
serde_json.workspace = true

[lints]
workspace = true
