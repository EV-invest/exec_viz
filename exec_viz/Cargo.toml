[package]
name = "exec_viz"
version = "0.1.0"
edition = "2024"

# The `exec_viz` bin is the Dioxus wasm front-end (dx builds it with `--no-default-features
# --features web`). The server is a lib (`serve`, generic over any `Dag`); `examples/demo.rs`
# is the demo-day runner.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "exec_viz"
path = "src/main.rs"
required-features = ["web"]

[features]
default = ["server"]
# The axum replay server, generic over `trading_data_dag::Dag`. Native only.
server = [
    "dep:axum",
    "dep:clap",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:trading_data_dag",
]
# The Dioxus WASM front-end (the `[lib]`, built with `--target wasm32`). Never compiles the server paths.
web = [
    "dep:dioxus",
    "dep:futures",
    "dep:getrandom",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "v_utils/lightweight_charts",
    "v_utils/wasm",
]

[dependencies]
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
gloo-net = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
trading_data_dag = { workspace = true, optional = true }
v_utils.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Document", "DomRect", "Element", "HtmlElement", "Window", "KeyboardEvent", "console"], optional = true }

# Example-only: the demo runner. Never in the lib's dep graph.
[dev-dependencies]
trading_data_demo = { workspace = true }

[[example]]
name = "demo"
required-features = ["server"]

[lints]
workspace = true
